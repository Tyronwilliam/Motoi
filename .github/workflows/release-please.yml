name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      kata-release-created: ${{ steps.release.outputs['packages/kata--release_created'] }}
      kata-tag-name: ${{ steps.release.outputs['packages/kata--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.kata-release-created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC) — no NPM_TOKEN needed
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.kata-tag-name }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm trusted publishing (OIDC) requires npm >= 11.5.1
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - run: bunx nx build @motoi/kata

      - name: Publish @motoi/kata to npm
        run: npm publish --access public
        working-directory: packages/kata
